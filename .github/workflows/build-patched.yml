name: Build patched URLCheck

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout patched branch
        uses: actions/checkout@v7
        with:
          ref: patched
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Create release store file
        run: |
          RELEASE_STORE_FILE=$(readlink -f release_store_file)
          echo -n "$RELEASE_STORE_FILE_ENCRYPTED" | base64 --decode > $RELEASE_STORE_FILE
          echo "RELEASE_STORE_FILE=$RELEASE_STORE_FILE" >> "$GITHUB_ENV"
        env:
          RELEASE_STORE_FILE_ENCRYPTED: ${{ secrets.RELEASE_STORE_FILE }}

      - name: Build alpha APK
        run: |
          ./gradlew assembleAlpha
          echo "filename=$(jq -r '.elements[0].outputFile' app/build/outputs/apk/alpha/output-metadata.json)" >> "$GITHUB_ENV"
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.filename }}
          path: app/build/outputs/apk/alpha/${{ env.filename }}
          archive: false
          if-no-files-found: error