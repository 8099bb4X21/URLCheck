name: Build patched URLCheck

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout patched branch
        uses: actions/checkout@v7
        with:
          ref: patched
          fetch-depth: 0

      - name: Fetch upstream master
        run: |
          git remote add upstream https://github.com/TrianguloY/URLCheck.git
          git fetch upstream master

      - name: Rebase patched on upstream/master
        run: |
          git rebase upstream/master

      - name: Push rebased patched branch
        run: |
          git push origin patched --force-with-lease

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: URLCheck-patched
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30
